<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Sophie Session Viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"
  onload="window._katexReady=true"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222536;
    --border: #2e3250;
    --accent: #7c83f5;
    --green: #4caf7d;
    --red: #e06c75;
    --yellow: #e5c07b;
    --muted: #6b7280;
    --text: #d4d8f0;
    --text-dim: #8890b0;
    --font: 'Segoe UI', system-ui, sans-serif;
    --mono: 'Cascadia Code', 'Fira Code', monospace;
  }

  a.kb-ref {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-family: var(--mono);
    font-size: 0.9em;
    border-bottom: 1px dashed var(--accent);
  }
  a.kb-ref:hover { color: var(--text); border-bottom-style: solid; }

  .kb-ref-highlight {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 4px;
    transition: outline 0.3s;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Landing ── */
  #landing {
    max-width: 680px;
    margin: 60px auto;
    padding: 0 24px;
  }
  .landing-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }
  .landing-sub { color: var(--text-dim); font-size: 13px; margin-bottom: 28px; }

  .btn-primary {
    display: flex; align-items: center; gap: 8px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 7px;
    padding: 9px 18px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: var(--font);
    transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 7px;
    padding: 9px 18px; font-size: 13px;
    cursor: pointer; font-family: var(--font);
    transition: color 0.15s, border-color 0.15s;
  }
  .btn-secondary:hover { color: var(--text); border-color: var(--accent); }


  /* Session list */
  #session-list { display: flex; flex-direction: column; gap: 8px; }
  #session-list-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  #session-list-header span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .refresh-tools {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .last-refreshed {
    font-size: 11px;
    color: var(--muted);
    text-transform: none;
    letter-spacing: 0;
  }
  .session-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    cursor: pointer;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: center;
    transition: border-color 0.15s, background 0.15s;
  }
  .session-item:hover { border-color: var(--accent); background: var(--surface2); }
  .session-current { border-color: rgba(124,131,245,0.4); }
  .session-conjecture { font-size: 13px; color: var(--text); line-height: 1.4; }
  .session-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .session-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

  /* ── Main layout ── */
  #app { display: none; max-width: 1100px; margin: 0 auto; padding: 24px; }

  /* ── Header ── */
  .header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
    margin-bottom: 20px;
  }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .conjecture-text {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    line-height: 1.5;
  }
  .status-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .status-open     { background: rgba(229,192,123,0.15); color: var(--yellow); border: 1px solid rgba(229,192,123,0.3); }
  .status-proved   { background: rgba(76,175,125,0.15);  color: var(--green);  border: 1px solid rgba(76,175,125,0.3); }
  .status-disproved{ background: rgba(224,108,117,0.15); color: var(--red);    border: 1px solid rgba(224,108,117,0.3); }
  .status-unknown  { background: rgba(107,114,128,0.15); color: var(--muted);  border: 1px solid rgba(107,114,128,0.3); }

  .header-meta { display: flex; gap: 20px; margin-top: 12px; flex-wrap: wrap; }
  .meta-item { color: var(--text-dim); font-size: 12px; }
  .meta-item span { color: var(--text); font-weight: 500; }

  /* ── Stats row ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
    gap: 8px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    text-align: center;
  }
  .stat-number { font-size: 18px; font-weight: 700; color: var(--accent); }
  .stat-label  { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 1px; }

  /* ── Stat-nav cards (replace tabs) ── */
  .stat-nav-card {
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .stat-nav-card:hover { border-color: var(--accent); background: var(--surface2); }
  .stat-nav-card.active {
    border-color: var(--accent);
    background: rgba(124,131,245,0.08);
  }
  .stat-nav-card.active .stat-label { color: var(--accent); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Timeline ── */
  .timeline { display: flex; flex-direction: column; gap: 16px; }

  .round-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .round-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .round-title { font-weight: 600; font-size: 13px; color: var(--accent); }
  .round-agents { display: flex; gap: 3px; flex-wrap: nowrap; }
  .agent-pill {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .agent-Experimenter { background: rgba(97,175,254,0.15); color: #61afef; }
  .agent-Prover       { background: rgba(76,175,125,0.15); color: var(--green); }
  .agent-Disprover    { background: rgba(224,108,117,0.15); color: var(--red); }
  .agent-Checker      { background: rgba(229,192,123,0.15); color: var(--yellow); }
  .agent-Searcher     { background: rgba(198,120,221,0.15); color: #c678dd; }
  .agent-Formalizer   { background: rgba(86,182,194,0.15); color: #56b6c2; }
  .agent-Researcher   { background: rgba(209,154,102,0.15); color: #d19a66; }

  .chevron { color: var(--muted); font-size: 12px; transition: transform 0.2s; }
  .round-block.collapsed .chevron { transform: rotate(-90deg); }

  .round-entries { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
  .round-block.collapsed .round-entries { display: none; }

  /* ── In-progress round ── */
  @keyframes sophie-pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }
  .in-progress-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: sophie-pulse 1.4s ease-in-out infinite;
    flex-shrink: 0;
  }
  .round-block-inprogress {
    border-color: rgba(124,131,245,0.4);
    background: var(--surface);
  }
  .round-header-inprogress {
    background: rgba(124,131,245,0.07);
    border-bottom-color: rgba(124,131,245,0.2);
  }
  .agent-pill-pending {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 10px;
    font-weight: 600;
    opacity: 0.35;
    background: var(--surface2);
    color: var(--text-dim);
  }

  .agent-entry { display: grid; grid-template-columns: 130px 1fr; gap: 12px; align-items: start; }
  .agent-name-col { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .agent-summary { color: var(--text-dim); font-size: 13px; line-height: 1.5; }
  .agent-summary strong { color: var(--text); }

  .round-narrative {
    margin-top: 12px;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-dim);
  }
  .round-narrative-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 5px;
  }

  /* ── Cards (examples, attempts) ── */
  .card-grid { display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    cursor: pointer;
    user-select: none;
    gap: 12px;
  }
  .card-header:hover { background: var(--surface2); }
  .card-id   { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .card-title { flex: 1; font-size: 13px; font-weight: 500; }
  .card-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
    flex-shrink: 0;
  }
  .badge-supports    { background: rgba(76,175,125,0.15); color: var(--green); }
  .badge-contradicts { background: rgba(224,108,117,0.15); color: var(--red); }
  .badge-neutral     { background: rgba(107,114,128,0.15); color: var(--muted); }
  .badge-valid       { background: rgba(76,175,125,0.15); color: var(--green); }
  .badge-flawed      { background: rgba(224,108,117,0.15); color: var(--red); }
  .badge-unchecked   { background: rgba(229,192,123,0.15); color: var(--yellow); }
  .badge-open        { background: rgba(107,114,128,0.15); color: var(--muted); }
  .badge-partial     { background: rgba(229,192,123,0.15); color: var(--yellow); }
  .badge-invalid     { background: rgba(224,108,117,0.15); color: var(--red); }
  .badge-resolved    { background: rgba(76,175,125,0.15); color: var(--green); }

  .card-body {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-dim);
    word-break: break-word;
    display: none;
  }
  .card.expanded .card-body { display: block; }
  /* Markdown resets inside card bodies */
  .card-body p { margin: 0.35em 0; }
  .card-body p:first-child { margin-top: 0; }
  .card-body p:last-child  { margin-bottom: 0; }
  .card-body ul, .card-body ol { margin: 0.35em 0; padding-left: 1.6em; }
  .card-body li { margin: 0.1em 0; }
  .card-body h1, .card-body h2, .card-body h3 { color: var(--text); margin: 0.6em 0 0.25em; font-size: 13px; }
  .card-body code { font-family: var(--mono); font-size: 11px; background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; }
  .card-body pre  { font-family: var(--mono); font-size: 11px; white-space: pre-wrap; word-break: break-word; background: rgba(0,0,0,0.25); padding: 8px 10px; border-radius: 4px; margin: 6px 0; overflow-x: auto; }
  .card-body pre code { background: none; padding: 0; }
  /* Verbatim code body (Lean, terminal output) */
  .card-body-code {
    font-family: var(--mono);
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .checker-feedback {
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--surface2);
    border-left: 3px solid var(--yellow);
    border-radius: 0 6px 6px 0;
    font-size: 12px;
    color: var(--text-dim);
  }
  .checker-feedback.valid { border-left-color: var(--green); }
  .checker-feedback.flawed { border-left-color: var(--red); }

  .round-tag { font-size: 11px; color: var(--muted); }

  /* ── Subproblems ── */
  .sp-list { display: flex; flex-direction: column; gap: 8px; }
  .sp-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    align-items: start;
  }
  .sp-icon { font-size: 14px; margin-top: 1px; }
  .sp-desc { font-size: 13px; color: var(--text); }
  .sp-resolution { margin-top: 6px; font-size: 12px; color: var(--green); }
  .sp-source { font-size: 11px; color: var(--muted); }

  /* ── Empty state ── */
  .empty { text-align: center; padding: 40px; color: var(--muted); }

  /* ── Load another ── */
  .reload-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font);
  }
  .reload-btn:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>

<!-- Landing -->
<div id="landing">
  <div class="landing-title">Sophie Session Viewer</div>
  <div class="landing-sub">Browse your conjecture exploration sessions.</div>

  <div id="session-list-wrap">
    <div id="session-list-header">
      <span id="session-list-label">Sessions</span>
      <div class="refresh-tools">
        <span class="last-refreshed" id="last-refreshed">Last refreshed: never</span>
        <button class="btn-secondary" id="btn-refresh" style="padding:5px 12px;font-size:12px" title="Refresh session list">Refresh</button>
      </div>
    </div>
    <div id="session-list"><div style="color:var(--muted);font-size:13px;padding:16px 0">Loading sessions…</div></div>
  </div>
</div>


<!-- Main app -->
<div id="app">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
    <div style="color:var(--muted); font-size:13px;">Sophie Session Viewer</div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="reload-btn" id="btn-refresh-app" title="Refresh current session">Refresh</button>
      <button class="reload-btn" onclick="resetViewer()"><- Back to sessions</button>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div class="conjecture-text" id="conjecture-text"></div>
      <div class="status-badge" id="status-badge"></div>
    </div>
    <div class="header-meta">
      <div class="meta-item">Session <span id="meta-session"></span></div>
      <div class="meta-item">Rounds completed: <span id="meta-rounds"></span></div>
    </div>
  </div>

  <!-- Stats / nav -->
  <div class="stats" id="stats-nav">
    <div class="stat-card stat-nav-card active" id="snav-rounds" onclick="showPanel('rounds')">
      <div class="stat-number" id="stat-rounds">0</div><div class="stat-label">Rounds</div>
    </div>
    <div class="stat-card stat-nav-card" id="snav-facts" onclick="showPanel('facts')">
      <div class="stat-number" id="stat-facts">0</div><div class="stat-label">Facts</div>
    </div>
    <div class="stat-card stat-nav-card" id="snav-examples" onclick="showPanel('examples')">
      <div class="stat-number" id="stat-examples">0</div><div class="stat-label">Examples</div>
    </div>
    <div class="stat-card stat-nav-card" id="snav-subproblems" onclick="showPanel('subproblems')">
      <div class="stat-number" id="stat-subproblems">0</div><div class="stat-label">Subproblems</div>
    </div>
    <div class="stat-card stat-nav-card" id="snav-proofs" onclick="showPanel('proofs')">
      <div class="stat-number" id="stat-proofs">0</div><div class="stat-label">Proof Attempts</div>
    </div>
    <div class="stat-card stat-nav-card" id="snav-disproofs" onclick="showPanel('disproofs')">
      <div class="stat-number" id="stat-disproofs">0</div><div class="stat-label">Disproofs</div>
    </div>
    <div class="stat-card stat-nav-card" id="snav-lean" onclick="showPanel('lean')">
      <div class="stat-number" id="stat-lean">0</div><div class="stat-label">Lean</div>
    </div>
    <div class="stat-card stat-nav-card" id="snav-implications" onclick="showPanel('implications')">
      <div class="stat-number" id="stat-implications">0</div><div class="stat-label">Implications</div>
    </div>
  </div>

  <div id="panel-rounds" class="tab-panel active"></div>
  <div id="panel-facts" class="tab-panel"></div>
  <div id="panel-examples" class="tab-panel"></div>
  <div id="panel-subproblems" class="tab-panel"></div>
  <div id="panel-proofs" class="tab-panel"></div>
  <div id="panel-disproofs" class="tab-panel"></div>
  <div id="panel-lean" class="tab-panel"></div>
  <div id="panel-implications" class="tab-panel"></div>
</div>

<script>
// ── UI State (preserves expansion states across re-renders) ───────────────
const _uiState = {
  rounds: {}, // roundNum -> boolean (isExpanded)
  cards:  {}  // id -> boolean (isExpanded)
};

// ── Auto-load ─────────────────────────────────────────────────────────────
(function () {
  // No embedded data — try manifest
  document.addEventListener('DOMContentLoaded', () => tryFetchManifest());
})();

// ── Fetch-based session list (works when served via HTTP) ──────────────────
async function tryFetchManifest(silent = false) {
  try {
    const resp = await fetch('./manifest.json', { cache: 'no-store' });
    if (!resp.ok) return;
    const sessions = await resp.json();
    if (!Array.isArray(sessions) || !sessions.length) return;
    populateFromManifest(sessions, silent);
    updateLastRefreshed();
  } catch { /* not served via HTTP — ignore */ }
}

async function populateFromManifest(sessions, silent = false) {
  const list = document.getElementById('session-list');
  const wrap = document.getElementById('session-list-wrap');
  const currentEntry = sessions.find(s => s.current);

  document.getElementById('session-list-label').textContent =
    `${sessions.length} session${sessions.length !== 1 ? 's' : ''}`;

  list.innerHTML = sessions.map((s, i) => {
    const conj = s.conjecture?.length > 100
      ? s.conjecture.slice(0, 100) + '\u2026' : (s.conjecture || s.filename);
    const statusClass = 'status-' + (s.status || 'open');
    const rounds = s.rounds_completed ?? 0;
    const ts = formatTimestamp(s.session_id);
    const currentBadge = s.current
      ? '<span class="card-badge" style="background:rgba(124,131,245,0.15);color:var(--accent);border:1px solid rgba(124,131,245,0.3)">current</span>' : '';
    return `
      <div class="session-item${s.current ? ' session-current' : ''}" data-filename="${esc(s.filename)}">
        <div>
          <div class="session-conjecture">${esc(conj)}</div>
          <div class="session-meta">${esc(ts)} \u00b7 ${rounds} round${rounds !== 1 ? 's' : ''}</div>
        </div>
        <div class="session-right">
          ${currentBadge}
          <span class="status-badge ${statusClass}">${esc(s.status || '?')}</span>
        </div>
      </div>`;
  }).join('');

  list.querySelectorAll('.session-item').forEach(el => {
    el.addEventListener('click', async () => {
      try {
        const url = './' + el.dataset.filename;
        const r = await fetch(url, { cache: 'no-store' });
        _currentFetchUrl = url;
        _currentHandle = null;
        render(await r.json());
        // Tell the server to update current.json + manifest.json (best-effort)
        fetch('/set-current', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: el.dataset.filename }),
        }).then(resp => {
          if (resp.ok) {
            // Update current highlight in the list without a full re-render
            list.querySelectorAll('.session-item').forEach(item =>
              item.classList.toggle('session-current', item === el)
            );
          }
        }).catch(() => { /* serve.py not running — ignore */ });
      } catch (e) { console.error('Failed to load session:', e); }
    });
  });

  wrap.style.display = 'block';

  // Auto-load current session (only if not already showing one)
  if (!silent && currentEntry) {
    try {
      const url = './' + currentEntry.filename;
      const r = await fetch(url, { cache: 'no-store' });
      _currentFetchUrl = url;
      _currentHandle = null;
      render(await r.json());
    } catch { /* ignore */ }
  }
}

// ── State ──────────────────────────────────────────────────────────────────
let _currentHandle = null;   // FileSystemFileHandle for the open session
let _currentFetchUrl = null; // URL for fetch-based sessions (HTTP mode)

async function reloadCurrentSession() {
  try {
    if (_currentHandle) {
      const file = await _currentHandle.getFile();
      render(JSON.parse(await file.text()));
    } else if (_currentFetchUrl) {
      const r = await fetch(_currentFetchUrl, { cache: 'no-store' });
      render(await r.json());
    }
  } catch (e) { console.warn('Manual reload failed:', e); }
}

// ── DOM refs ────────────────────────────────────────────────────────────
const btnRefresh = document.getElementById('btn-refresh');
const btnRefreshApp = document.getElementById('btn-refresh-app');
const lastRefreshed = document.getElementById('last-refreshed');

function updateLastRefreshed() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  lastRefreshed.textContent = `Last refreshed: ${hh}:${mm}:${ss}`;
}

async function handleRefreshClick() {
  if (_currentHandle || _currentFetchUrl) await reloadCurrentSession();
  await tryFetchManifest(/* silent= */ true);
}

btnRefresh.addEventListener('click', handleRefreshClick);
btnRefreshApp.addEventListener('click', handleRefreshClick);

function formatTimestamp(sid) {
  if (!sid) return '';
  const m = sid.match(/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/);
  if (!m) return sid;
  return `${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}`;
}

function resetViewer() {
  _currentHandle = null;
  _currentFetchUrl = null;
  document.getElementById('landing').style.display = 'block';
  document.getElementById('app').style.display = 'none';
  tryFetchManifest(/* silent= */ true);
}

// ── Render ─────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Escape then replace KB IDs with clickable links (used for short header text)
function linkify(text) {
  const escaped = esc(text);
  return escaped.replace(/\b((PA|DA|SP|EX|FT|IMP|FA)-[0-9A-F]{6})\b/g,
    (m) => `<a class="kb-ref" href="#" onclick="jumpTo('${m}');return false">${m}</a>`);
}

// ── Markdown + LaTeX rendering ────────────────────────────────────────────────
// Protect $...$ and $$...$$ from marked's HTML escaper by replacing them with
// <x-m id="N"></x-m> raw-HTML placeholders (marked passes raw HTML through),
// then restoring them after markdown rendering so KaTeX auto-render finds them.
function _applyMarkdown(src, parseInline) {
  if (!src) return '';
  if (typeof marked === 'undefined') return linkify(src); // CDN fallback

  const math = [];
  function save(m) { math.push(m); return `<x-m id="${math.length - 1}"></x-m>`; }

  let protected_ = String(src)
    .replace(/\$\$[\s\S]*?\$\$/g, save)         // display math first
    .replace(/\$(?!\$)[^$\n]+?\$/g, save);       // then inline math

  marked.setOptions({ gfm: true, breaks: false });
  let html = parseInline
    ? (marked.parseInline ? marked.parseInline(protected_) : marked.parse(protected_))
    : marked.parse(protected_);

  // Restore math spans
  html = html.replace(/<x-m id="(\d+)"><\/x-m>/g, (_, i) => math[+i]);

  // Linkify KB IDs
  html = html.replace(/\b((PA|DA|SP|EX|FT|IMP|FA)-[0-9A-F]{6})\b/g,
    (m) => `<a class="kb-ref" href="#" onclick="jumpTo('${m}');return false">${m}</a>`);

  return html;
}

// Block markdown (paragraphs, lists, headings, code fences) — for body content
function renderMarkdown(text) { return _applyMarkdown(text, false); }
// Inline markdown only (bold/italic/code, no block wrapping) — for titles/summaries
function renderInline(text)   { return _applyMarkdown(text, true);  }

function render(d) {
  // Normalise — new stub sessions may be missing some arrays
  d.examples               = d.examples               || [];
  d.subproblems            = d.subproblems            || [];
  d.proof_attempts         = d.proof_attempts         || [];
  d.disproof_attempts      = d.disproof_attempts      || [];
  d.formalization_attempts = d.formalization_attempts || [];
  d.round_summaries        = d.round_summaries        || [];
  d.log                    = d.log                    || [];
  d.facts                  = d.facts                  || [];
  d.implications           = d.implications           || [];

  // Header
  document.getElementById('conjecture-text').textContent = d.conjecture;
  const badge = document.getElementById('status-badge');
  badge.textContent = d.status;
  badge.className = 'status-badge status-' + d.status;
  document.getElementById('meta-session').textContent = d.session_id;
  document.getElementById('meta-rounds').textContent = d.rounds_completed;

  // Stats / nav counts
  document.getElementById('stat-rounds').textContent      = d.rounds_completed;
  document.getElementById('stat-facts').textContent       = d.facts.length;
  document.getElementById('stat-examples').textContent    = d.examples.length;
  document.getElementById('stat-subproblems').textContent = d.subproblems.length;
  document.getElementById('stat-proofs').textContent      = d.proof_attempts.length;
  document.getElementById('stat-disproofs').textContent   = d.disproof_attempts.length;
  document.getElementById('stat-lean').textContent        = d.formalization_attempts.length;
  document.getElementById('stat-implications').textContent = d.implications.length;

  // Ensure rounds panel is active on fresh load
  showPanel('rounds');

  renderRounds(d);
  renderFacts(d.facts);
  renderExamples(d.examples);
  renderSubproblems(d.subproblems);
  renderProofs(d.proof_attempts);
  renderDisproofs(d.disproof_attempts);
  renderLean(d.formalization_attempts || [], d);
  renderImplications(d.implications, d);

  document.getElementById('landing').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  // Render math via KaTeX (deferred until katex scripts load)
  function doKatex() {
    if (window._katexReady && window.renderMathInElement) {
      renderMathInElement(document.getElementById('app'), {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$',  right: '$',  display: false}
        ],
        throwOnError: false
      });
    } else {
      setTimeout(doKatex, 80);
    }
  }
  doKatex();
}

function renderRounds(d) {
  // Prefer round_summaries (grouped, authoritative) if present; fall back to log.
  const hasSummaries = Array.isArray(d.round_summaries) && d.round_summaries.length > 0;

  // Build a map: round → [{agent, summary}] from the log (for agent pills + fallback)
  const logByRound = {};
  for (const entry of (d.log || [])) {
    if (!logByRound[entry.round]) logByRound[entry.round] = [];
    logByRound[entry.round].push(entry);
  }

  // Collect round numbers from whichever source is primary
  const roundNums = hasSummaries
    ? [...new Set(d.round_summaries.map(r => r.round))].sort((a,b) => a-b)
    : Object.keys(logByRound).map(Number).sort((a,b) => a-b);

  let html = '<div class="timeline">';

  if (!roundNums.length) {
    html += '<div class="empty">No round log entries yet.</div>';
  }

  for (const r of roundNums) {
    const logEntries = logByRound[r] || [];
    let agents = [...new Set(logEntries.map(e => e.agent))];

    const rSumObj = (d.round_summaries || []).find(rs => rs.round === r);

    // If log is empty, try deriving agents from summaries
    if (agents.length === 0 && rSumObj && rSumObj.summaries) {
      agents = rSumObj.summaries.map(line => {
        const colon = line.indexOf(':');
        return colon > 0 ? line.slice(0, colon).trim() : '';
      }).filter(a => a);
    }

    const agentPills = agents.map(a =>
      `<span class="agent-pill agent-${esc(a)}" title="${esc(a)}">${esc(a[0])}</span>`
    ).join('');

    let entriesHtml = '';

    if (hasSummaries) {
      // Use round_summaries as primary source — one summary string per agent ("Agent: text")
      const rSummary = d.round_summaries.find(rs => rs.round === r);
      const summaryLines = rSummary ? rSummary.summaries : [];

      if (summaryLines.length) {
        for (const line of summaryLines) {
          // Split "AgentName: rest of text" for coloured pill + summary
          const colon = line.indexOf(':');
          const agentName = colon > 0 ? line.slice(0, colon).trim() : '';
          const summaryText = colon > 0 ? line.slice(colon + 1).trim() : line;
          const pillClass = agentName ? `agent-${esc(agentName)}` : '';
          entriesHtml += `
            <div class="agent-entry">
              <div class="agent-name-col">
                ${agentName
                  ? `<span class="agent-pill ${pillClass}">${esc(agentName)}</span>`
                  : ''}
              </div>
              <div class="agent-summary">${renderInline(summaryText)}</div>
            </div>`;
        }
      } else {
        // round_summaries entry exists but is empty — fall back to log
        for (const entry of logEntries) {
          entriesHtml += `
            <div class="agent-entry">
              <div class="agent-name-col">
                <span class="agent-pill agent-${esc(entry.agent)}">${esc(entry.agent)}</span>
              </div>
              <div class="agent-summary">${renderInline(entry.summary)}</div>
            </div>`;
        }
      }
    } else {
      // No round_summaries — use log entries directly
      for (const entry of logEntries) {
        entriesHtml += `
          <div class="agent-entry">
            <div class="agent-name-col">
              <span class="agent-pill agent-${esc(entry.agent)}">${esc(entry.agent)}</span>
            </div>
            <div class="agent-summary">${renderInline(entry.summary)}</div>
          </div>`;
      }
    }

    // Narrative paragraph if stored
    const narrativeHtml = rSumObj?.narrative
      ? `<div class="round-narrative"><div class="round-narrative-label">Round summary</div>${renderMarkdown(rSumObj.narrative)}</div>`
      : '';

    // Expansion state: check _uiState first, fall back to isLatest
    const isLatest = (r === roundNums[roundNums.length - 1]);
    if (_uiState.rounds[r] === undefined) _uiState.rounds[r] = isLatest;
    const isExpanded = _uiState.rounds[r];
    const collapsedClass = isExpanded ? '' : ' collapsed';
    const chevron = isExpanded ? '▾' : '▸';
    html += `
      <div class="round-block${collapsedClass}" id="round-${r}">
        <div class="round-header" onclick="toggleRound(${r})">
          <span class="round-title">Round ${r}</span>
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="round-agents">${agentPills}</div>
            <span class="chevron">${chevron}</span>
          </div>
        </div>
        <div class="round-entries">${entriesHtml}${narrativeHtml}</div>
      </div>`;
  }

  // ── In-progress round (current_round_state) ─────────────────────────────
  const crs = d.current_round_state;
  if (crs && Array.isArray(crs.planned) && crs.planned.length > 0) {
    const planned   = crs.planned   || [];
    const completed = crs.completed || [];
    const summaries = crs.summaries || [];  // "AgentName: text" strings
    const pending   = planned.filter(a => !completed.includes(a));

    // Pills: completed in colour, pending greyed-out (initials only in header)
    const pills = planned.map(a => {
      if (completed.includes(a))
        return `<span class="agent-pill agent-${esc(a)}" title="${esc(a)}">${esc(a[0])}</span>`;
      return `<span class="agent-pill-pending" title="${esc(a)}">${esc(a[0])}</span>`;
    }).join('');

    // Completed agent entries
    let entriesHtml = '';
    for (const line of summaries) {
      const colon = line.indexOf(':');
      const agentName  = colon > 0 ? line.slice(0, colon).trim() : '';
      const summaryTxt = colon > 0 ? line.slice(colon + 1).trim() : line;
      entriesHtml += `
        <div class="agent-entry">
          <div class="agent-name-col">
            ${agentName ? `<span class="agent-pill agent-${esc(agentName)}">${esc(agentName)}</span>` : ''}
          </div>
          <div class="agent-summary">${renderInline(summaryTxt)}</div>
        </div>`;
    }
    // Pending agent placeholders
    for (const a of pending) {
      entriesHtml += `
        <div class="agent-entry" style="opacity:0.45">
          <div class="agent-name-col">
            <span class="agent-pill-pending">${esc(a)}</span>
          </div>
          <div class="agent-summary" style="font-style:italic">waiting…</div>
        </div>`;
    }

    html += `
      <div class="round-block round-block-inprogress" id="round-inprogress">
        <div class="round-header round-header-inprogress" style="cursor:default">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="in-progress-dot"></span>
            <span class="round-title">Round ${crs.round} — in progress</span>
          </div>
          <div class="round-agents">${pills}</div>
        </div>
        <div class="round-entries">${entriesHtml}</div>
      </div>`;
  }

  html += '</div>';
  document.getElementById('panel-rounds').innerHTML = html;

  // Scroll the latest round (or in-progress block) into view
  const inprog = document.getElementById('round-inprogress');
  if (inprog) {
    inprog.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else if (roundNums.length) {
    const latest = document.getElementById('round-' + roundNums[roundNums.length - 1]);
    if (latest) latest.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function renderFacts(facts) {
  const panel = document.getElementById('panel-facts');
  if (!facts.length) {
    panel.innerHTML = '<div class="empty">No facts recorded yet. Use <code>add_fact</code> to add established results.</div>';
    return;
  }
  let html = '<div class="sp-list">';
  for (const f of facts) {
    html += `
      <div class="sp-item" id="card-${f.id}">
        <span class="sp-icon" style="color:var(--accent)">★</span>
        <div>
          <div class="sp-desc">${renderInline(f.text)}</div>
          <div class="sp-source" style="margin-top:4px"><span class="card-id">${esc(f.id)}</span> · added round ${f.added_round ?? '?'}</div>
        </div>
        <span class="card-badge badge-valid">fact</span>
      </div>`;
  }
  html += '</div>';
  panel.innerHTML = html;
}

function renderExamples(examples) {
  if (!examples.length) {
    document.getElementById('panel-examples').innerHTML = '<div class="empty">No examples recorded yet.</div>';
    return;
  }
  let html = '<div class="card-grid">';
  for (const ex of examples) {
    if (_uiState.cards[ex.id] === undefined) _uiState.cards[ex.id] = true; // Default expanded
    const expandedClass = _uiState.cards[ex.id] ? ' expanded' : '';
    const chevron = _uiState.cards[ex.id] ? '▴' : '▾';
    
    const supMap = {true: ['supports','badge-supports'], false: ['contradicts','badge-contradicts'], null: ['neutral','badge-neutral']};
    const [supLabel, supClass] = supMap[ex.supports_conjecture] ?? ['?','badge-neutral'];
    html += `
      <div class="card${expandedClass}" id="card-${ex.id}">
        <div class="card-header" onclick="toggleCard('${ex.id}')">
          <span class="card-id">${esc(ex.id)}</span>
          <span class="card-title">${renderInline(ex.description)}</span>
          <span class="card-badge ${supClass}">${supLabel}</span>
          <span class="chevron">${chevron}</span>
        </div>
        <div class="card-body">${renderMarkdown(ex.detail)}</div>
      </div>`;
  }
  html += '</div>';
  document.getElementById('panel-examples').innerHTML = html;
}

function renderSubproblems(sps) {
  if (!sps.length) {
    document.getElementById('panel-subproblems').innerHTML = '<div class="empty">No subproblems recorded yet.</div>';
    return;
  }

  // Group: open, then partial, then resolved
  const open     = sps.filter(s => s.status === 'open');
  const partial  = sps.filter(s => s.status === 'partial');
  const resolved = sps.filter(s => s.status === 'resolved');
  const other    = sps.filter(s => !['open','partial','resolved'].includes(s.status));

  let html = '<div class="sp-list">';

  const renderSp = sp => {
    const icon = sp.status === 'resolved' ? '✓' : sp.status === 'partial' ? '◑' : '○';
    const badge = `<span class="card-badge badge-${sp.status}">${sp.status}</span>`;
    const resolution = sp.resolution
      ? `<div class="sp-resolution">↳ ${renderInline(sp.resolution)}</div>` : '';
    html += `
      <div class="sp-item" id="card-${sp.id}">
        <span class="sp-icon" style="color:${sp.status==='resolved'?'var(--green)':sp.status==='partial'?'var(--yellow)':'var(--muted)'}">${icon}</span>
        <div>
          <div class="sp-desc">${renderInline(sp.description)}</div>
          ${resolution}
          <div class="sp-source" style="margin-top:4px">from ${esc(sp.source_agent)} · <span class="card-id">${esc(sp.id)}</span></div>
        </div>
        ${badge}
      </div>`;
  };

  open.forEach(renderSp);
  partial.forEach(renderSp);
  other.forEach(renderSp);
  resolved.forEach(renderSp);

  html += '</div>';
  document.getElementById('panel-subproblems').innerHTML = html;
}

function renderProofs(proofs) {
  if (!proofs.length) {
    document.getElementById('panel-proofs').innerHTML = '<div class="empty">No proof attempts yet.</div>';
    return;
  }
  let html = '<div class="card-grid">';
  for (const pa of proofs) {
    if (_uiState.cards[pa.id] === undefined) _uiState.cards[pa.id] = false; // Default collapsed
    const expandedClass = _uiState.cards[pa.id] ? ' expanded' : '';
    const chevron = _uiState.cards[pa.id] ? '▴' : '▾';

    const feedback = pa.checker_feedback
      ? `<div class="checker-feedback ${pa.status}"><strong>Checker:</strong> ${renderMarkdown(pa.checker_feedback)}</div>` : '';
    html += `
      <div class="card${expandedClass}" id="card-${pa.id}">
        <div class="card-header" onclick="toggleCard('${pa.id}')">
          <span class="card-id">${esc(pa.id)}</span>
          <span class="card-title" style="font-family:var(--mono);font-size:12px;color:var(--text-dim)">${esc(pa.sketch.slice(0,120))}…</span>
          <span class="round-tag">round ${pa.round}</span>
          <span class="card-badge badge-${pa.status}">${pa.status}</span>
          <span class="chevron">${chevron}</span>
        </div>
        <div class="card-body">${renderMarkdown(pa.sketch)}${feedback}</div>
      </div>`;
  }
  html += '</div>';
  document.getElementById('panel-proofs').innerHTML = html;
}

  }

    const feedback = da.checker_feedback
      ? `<div class="checker-feedback ${da.status}"><strong>Checker:</strong> ${renderMarkdown(da.checker_feedback)}</div>` : '';
    html += `
      <div class="card${expandedClass}" id="card-${da.id}">
        <div class="card-header" onclick="toggleCard('${da.id}')">
          <span class="card-id">${esc(da.id)}</span>
          <span class="card-title" style="font-family:var(--mono);font-size:12px;color:var(--text-dim)">${esc(da.candidate_counterexample.slice(0,120))}…</span>
          <span class="round-tag">round ${da.round}</span>
          <span class="card-badge badge-${da.status}">${da.status}</span>
          <span class="chevron">${chevron}</span>

  html += '</div>';
  document.getElementById('panel-disproofs').innerHTML = html;

// ── Lean formalization ─────────────────────────────────────────────────────

function renderImplications(imps, d) {
  const panel = document.getElementById('panel-implications');
  if (!imps.length) {
    panel.innerHTML = '<div class="empty">No implications recorded yet.</div>';
    return;
  }

  // Build id→label lookup from whole session
  const idLabel = {};
  for (const sp of (d.subproblems || [])) idLabel[sp.id] = sp.description.slice(0, 80);
  for (const pa of (d.proof_attempts || [])) idLabel[pa.id] = pa.sketch.slice(0, 80);
  for (const f  of (d.facts || []))  idLabel[f.id]  = f.text.slice(0, 80);

  const arrowMap = {
    proves:     { sym: '⟹', color: 'var(--green)' },
    supports:   { sym: '→',  color: 'var(--accent)' },
    blocks:     { sym: '✗',  color: 'var(--red)' },
    equivalent: { sym: '⟺', color: 'var(--yellow)' },
  };

  // Sort: valid first, then unchecked, then flawed
  const order = { valid: 0, unchecked: 1, flawed: 2 };
  const sorted = [...imps].sort((a, b) => (order[a.status || 'unchecked'] ?? 1) - (order[b.status || 'unchecked'] ?? 1));

  let html = '<div class="sp-list">';
  for (const imp of sorted) {
    const status   = imp.status || 'unchecked';
    const { sym, color } = arrowMap[imp.type] || { sym: '→', color: 'var(--muted)' };
    const conf     = imp.confidence === 'certain' ? '(certain)' : '(plausible)';
    const fromLbl  = idLabel[imp.from_id] || imp.from_id;
    const toLbl    = idLabel[imp.to_id]   || imp.to_id;
    const feedback = imp.checker_feedback
      ? `<div class="sp-resolution checker-feedback ${status}"><strong>Checker:</strong> ${renderMarkdown(imp.checker_feedback)}</div>` : '';
    const note     = imp.note
      ? `<div class="sp-resolution" style="color:var(--text-dim)">Note: ${renderInline(imp.note)}</div>` : '';
    html += `
      <div class="sp-item" id="card-${imp.id}">
        <span class="sp-icon" style="color:${color};font-size:18px">${sym}</span>
        <div style="flex:1;min-width:0">
          <div class="sp-desc">
            <span class="card-id">${esc(imp.from_id)}</span>
            <span style="color:${color};margin:0 6px">${sym} ${esc(imp.type)}</span>
            <span class="card-id">${esc(imp.to_id)}</span>
            <span style="color:var(--muted);margin-left:6px;font-size:12px">${conf}</span>
          </div>
          <div style="color:var(--text-dim);font-size:12px;margin-top:3px">
            <em>${renderInline(fromLbl)}</em>
            <span style="margin:0 5px;color:${color}">${sym}</span>
            <em>${renderInline(toLbl)}</em>
          </div>
          ${note}${feedback}
          <div class="sp-source" style="margin-top:4px">
            <span class="card-id">${esc(imp.id)}</span> · added round ${imp.added_round ?? '?'}
          </div>
        </div>
        <span class="card-badge badge-${status}">${status}</span>
      </div>`;
  }
  html += '</div>';
  panel.innerHTML = html;
}

function renderLean(attempts, d) {
  const panel = document.getElementById('panel-lean');

  // Build a lookup for source previews
  const sourceMap = {};
  for (const pa of d.proof_attempts)  sourceMap[pa.id] = { label: 'Proof attempt', text: pa.sketch };
  for (const sp of d.subproblems)     sourceMap[sp.id] = { label: 'Subproblem',    text: sp.description };

  let html = '';

  // Suggestion banner (proof attempts not yet formalized)
  const alreadyFormalized = new Set(attempts.map(a => a.source_id));
  const suggestions = d.proof_attempts.filter(
    pa => !alreadyFormalized.has(pa.id) && (pa.status === 'valid' || pa.sketch?.length > 300)
  );
  if (suggestions.length) {
    html += '<div style="background:rgba(124,131,245,0.08);border:1px solid rgba(124,131,245,0.25);border-radius:8px;padding:12px 16px;margin-bottom:16px;">';
    html += '<div style="font-size:12px;color:var(--accent);font-weight:600;margin-bottom:6px;">SUGGESTED FOR FORMALIZATION</div>';
    for (const pa of suggestions) {
      const reason = pa.status === 'valid'
        ? 'Checker-validated proof'
        : 'Substantial proof sketch';
      html += `<div style="font-size:12px;color:var(--text-dim);margin-bottom:3px;">`;
      html += `<span class="card-id">${esc(pa.id)}</span> · <span class="badge-${pa.status}" style="font-size:11px">${esc(reason)}</span>`;
      html += ` — <em>${esc(pa.sketch.slice(0, 80))}…</em></div>`;
    }
    html += '<div style="font-size:11px;color:var(--muted);margin-top:8px;">Ask Sophie: "Formalize <ID>" to begin.</div>';
    html += '</div>';
  }

  if (!attempts.length) {
    html += '<div class="empty">No Lean formalizations yet.' +
      (suggestions.length ? ' See suggestions above.' : '') + '</div>';
    panel.innerHTML = html;
    return;
  }

  html += '<div class="card-grid">';
  for (const fa of attempts) {
    if (_uiState.cards[fa.id] === undefined) _uiState.cards[fa.id] = false; // Default collapsed
    const expandedClass = _uiState.cards[fa.id] ? ' expanded' : '';
    const chevron = _uiState.cards[fa.id] ? '▴' : '▾';

    const src = sourceMap[fa.source_id] ?? { label: 'Unknown', text: '' };
    const confClass = fa.confidence === 'complete' ? 'badge-valid'
                    : fa.confidence === 'partial'  ? 'badge-unchecked'
                    : 'badge-neutral';
    const sorryNote = fa.sorries?.length
      ? `<span style="font-size:11px;color:var(--red);margin-left:8px">${fa.sorries.length} sorry${fa.sorries.length > 1 ? 's' : ''}</span>` : '';

    html += `
      <div class="card${expandedClass}" id="card-${fa.id}">
        <div class="card-header" onclick="toggleCard('${fa.id}')">
          <span class="card-id">${esc(fa.id)}</span>
          <span class="card-title" style="font-size:12px;color:var(--text-dim)">
            ${esc(src.label)} <span class="card-id">${esc(fa.source_id)}</span>
            ${sorryNote}
          </span>
          <span class="card-badge ${confClass}">${esc(fa.confidence)}</span>
          <span class="chevron">${chevron}</span>
        </div>
        <div class="card-body card-body-code">`;

    if (fa.mathlib_imports?.length) {
      html += `<div style="color:var(--muted);margin-bottom:8px">${fa.mathlib_imports.map(i => esc(i)).join('\n')}</div>`;
    }

    html += esc(fa.lean_code);

    if (fa.sorries?.length) {
      html += `\n\n<div style="border-top:1px solid var(--border);margin-top:10px;padding-top:10px;font-family:var(--font);white-space:normal;color:var(--red);font-size:12px"><strong>Sorries to fill:</strong><ol style="margin:6px 0 0;padding-left:1.4em">`;
      fa.sorries.forEach(s => { html += `<li>${renderInline(s)}</li>`; });
      html += '</ol></div>';
    }

    if (fa.notes) {
      html += `<div style="border-top:1px solid var(--border);margin-top:10px;padding-top:10px;font-family:var(--font);white-space:normal;color:var(--text-dim);font-size:12px"><strong>Notes:</strong> ${renderMarkdown(fa.notes)}</div>`;
    }

    html += `</div></div>`;
  }
  html += '</div>';
  panel.innerHTML = html;
}

// ── Interactions ───────────────────────────────────────────────────────────

function showPanel(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.stat-nav-card').forEach(c => c.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  const nav = document.getElementById('snav-' + name);
  if (nav) nav.classList.add('active');
}

function toggleRound(r) {
  const el = document.getElementById('round-' + r);
  el.classList.toggle('collapsed');
  const isExpanded = !el.classList.contains('collapsed');
  _uiState.rounds[r] = isExpanded;
  const chevron = el.querySelector('.chevron');
  if (chevron) chevron.textContent = isExpanded ? '▾' : '▸';
}

function toggleCard(id) {
  const el = document.getElementById('card-' + id);
  el.classList.toggle('expanded');
  _uiState.cards[id] = el.classList.contains('expanded');
}

function jumpTo(id) {
  const prefix = id.split('-')[0];
  const panelMap = { PA: 'proofs', DA: 'disproofs', SP: 'subproblems',
                     EX: 'examples', FT: 'facts', IMP: 'implications', FA: 'lean' };
  const panel = panelMap[prefix];
  if (!panel) return;
  showPanel(panel);
  const el = document.getElementById('card-' + id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('kb-ref-highlight');
  setTimeout(() => el.classList.remove('kb-ref-highlight'), 1500);
}
</script>
</body>
</html>
